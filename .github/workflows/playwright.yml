name: Pruebas Sauce Demo

# Solo se ejecuta a mano: pestaña Actions → "Pruebas Sauce Demo" → "Run workflow".
# No se lanza en cada push porque la tienda bloquea (HTTP 429 / Cloudflare)
# cuando recibe muchas peticiones automáticas.
on:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Ejecutar pruebas
        run: npx playwright test -c playwright.sauce.config.ts
      - name: Guardar reporte HTML
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reporte-sauce-demo
          path: reporte-sauce-demo/
          retention-days: 30
      - name: Guardar evidencias
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: evidencias
          path: evidencias/
          retention-days: 30
